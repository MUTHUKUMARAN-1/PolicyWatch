{% extends 'base.html' %}

{% block title %}Create User Account - Privacy Policy &amp; Terms Change Tracker{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
  <h2>Create User Account</h2>
  <p style="color: #64748b; font-size: 0.9rem;">
    Register a new user profile in the relational SQLite database.
  </p>

  <form method="POST" action="{{ url_for('register') }}">
    <fieldset>
      <legend>User Registration</legend>

      <label for="username">Username (minimum 3 characters)</label>
      <input
        type="text"
        id="username"
        name="username"
        value="{{ username or '' }}"
        placeholder="e.g. alex_compliance"
        required
        minlength="3"
        autofocus
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        value="{{ email or '' }}"
        placeholder="alex@company.com"
        required
      >

      <label for="password">Password (minimum 6 characters)</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Create secure password"
        required
        minlength="6"
      >

      <label for="confirm_password">Confirm Password</label>
      <input
        type="password"
        id="confirm_password"
        name="confirm_password"
        placeholder="Re-enter password"
        required
        minlength="6"
      >

      <button type="submit" style="width: 100%; margin-top: 1.25rem;">
        Register Account
      </button>
    </fieldset>
  </form>

  <p style="text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: #64748b;">
    Already have an account?
    <a href="{{ url_for('login') }}" style="color: #2563eb; font-weight: 600;">Sign in here</a>
  </p>
</div>
{% endblock %}
